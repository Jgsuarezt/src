<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="pageTitle">Posterizer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- ==================== SELECTOR DE IDIOMA ==================== -->
<div class="lang-overlay" id="langOverlay">
  <div class="lang-modal">
    <p class="lang-modal-title">Select your language</p>
    <p class="lang-modal-sub">Elige tu idioma · Choisissez votre langue · Scegli la tua lingua · Escolha o seu idioma · Wähle deine Sprache · 选择语言</p>
    <div class="lang-grid" id="langGrid"></div>
  </div>
</div>

<header class="topbar">
  <div class="topbar-row">
    <h1>
      <svg class="mark" viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.4"/>
        <line x1="12" y1="1" x2="12" y2="7" stroke="currentColor" stroke-width="1.4"/>
        <line x1="12" y1="17" x2="12" y2="23" stroke="currentColor" stroke-width="1.4"/>
        <line x1="1" y1="12" x2="7" y2="12" stroke="currentColor" stroke-width="1.4"/>
        <line x1="17" y1="12" x2="23" y2="12" stroke="currentColor" stroke-width="1.4"/>
        <circle cx="12" cy="12" r="2" fill="currentColor"/>
      </svg>
      <span id="txt-appName">Posterizer</span>
    </h1>
    <select id="langSwitch" class="lang-switch" aria-label="Language"></select>
  </div>
  <p class="tagline" id="txt-tagline"></p>
  <div class="color-bar" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
</header>

<main class="layout">

  <!-- ==================== PANEL DE CONTROLES ==================== -->
  <section class="panel" id="controls">

    <div class="field-group">
      <h2><span class="step-no">1</span> <span id="txt-step1Title"></span></h2>
      <label class="dropzone" id="dropzone">
        <input type="file" id="fileInput" accept="image/png,image/jpeg" hidden>
        <span id="dropzoneText"></span>
        <canvas id="thumbCanvas" hidden></canvas>
      </label>
      <p class="hint" id="thumbGridCaption"></p>
    </div>

    <div class="field-group">
      <h2><span class="step-no">2</span> <span id="txt-step2Title"></span></h2>
      <div class="row">
        <label><span id="txt-fieldPaperSize"></span>
          <select id="pageSize">
            <option value="A4" selected>A4 (210 × 297 mm)</option>
            <option value="LETTER" id="opt-paperLetter">Letter (215.9 × 279.4 mm)</option>
            <option value="LEGAL" id="opt-paperLegal">Legal (215.9 × 355.6 mm)</option>
            <option value="A3">A3 (297 × 420 mm)</option>
          </select>
        </label>
        <label><span id="txt-fieldOrientation"></span>
          <select id="orientation">
            <option value="portrait" selected id="opt-orientationPortrait">Portrait</option>
            <option value="landscape" id="opt-orientationLandscape">Landscape</option>
          </select>
        </label>
      </div>
      <div class="row">
        <label><span id="txt-fieldMargin"></span>
          <div class="unit-input">
            <input type="number" id="margin" value="10" min="0" step="1">
            <span>mm</span>
          </div>
        </label>
        <label><span id="txt-fieldOverlap"></span>
          <div class="unit-input">
            <input type="number" id="overlap" value="10" min="0" step="1">
            <span>mm</span>
          </div>
        </label>
      </div>
    </div>

    <div class="field-group">
      <h2><span class="step-no">3</span> <span id="txt-step3Title"></span></h2>
      <label><span id="txt-fieldSheetsWide"></span>
        <input type="number" id="sheetsWide" value="4" min="1" max="30" step="1">
      </label>
    </div>

    <div class="field-group">
      <h2><span class="step-no">4</span> <span id="txt-step4Title"></span></h2>
      <label><span id="txt-fieldStyle"></span>
        <select id="effect">
          <option value="none" selected id="opt-effectNone">None</option>
          <option value="bw" id="opt-effectBw">Black &amp; white</option>
        </select>
      </label>
      <label id="dotSizeLabel" style="display:none;"><span id="txt-fieldDotSize"></span> <span id="dotSizeValue" class="mono">8px</span>
        <div class="range-row">
          <span class="range-edge-label" id="txt-dotQualityHigh"></span>
          <input type="range" id="dotSize" min="3" max="30" value="8">
          <span class="range-edge-label" id="txt-dotQualityLow"></span>
        </div>
      </label>
    </div>

    <div class="field-group">
      <h2><span class="step-no">5</span> <span id="txt-step5Title"></span></h2>
      <label><span id="txt-fieldResolution"></span>
        <select id="dpi">
          <option value="100" id="opt-dpiDraft">Draft (100 dpi)</option>
          <option value="150" selected id="opt-dpiNormal">Normal (150 dpi)</option>
          <option value="300" id="opt-dpiHigh">High (300 dpi)</option>
        </select>
      </label>
      <p class="hint-caption" id="dpiLockHint" hidden>
        <svg viewBox="0 0 20 20" width="11" height="11" aria-hidden="true"><rect x="4.5" y="9" width="11" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M7 9V6a3 3 0 0 1 6 0v3" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        <span id="txt-dpiLockHint"></span>
      </p>
    </div>

    <div class="field-group">
      <h2><span class="step-no">6</span> <span id="txt-step6Title"></span></h2>
      <label class="checkbox-row">
        <input type="checkbox" id="cropMarksToggle" checked>
        <span id="txt-fieldCropMarks"></span>
        <span class="hint-badge" id="hint-cropMarksTooltip" tabindex="0">?</span>
      </label>
      <p class="hint-caption" id="txt-cropMarksHint"></p>
    </div>

    <button id="generateBtn" class="primary-btn" disabled></button>
    <p class="hint" id="statusText"></p>

    <div class="field-group unlock-card" id="unlockCard">
      <h2>
        <svg class="lock-icon" viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><rect x="4.5" y="9" width="11" height="8" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/><path d="M7 9V6a3 3 0 0 1 6 0v3" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>
        <span id="txt-unlockTitle"></span>
      </h2>
      <p class="hint" id="txt-unlockDesc"></p>

      <div id="unlockLocked">
        <button type="button" id="buyLicenseBtn" class="primary-btn"><span id="txt-buyLicenseBtn"></span></button>
        <div class="license-row">
          <input type="text" id="licenseKeyInput" autocomplete="off" spellcheck="false">
          <button type="button" id="activateLicenseBtn" class="secondary-btn"><span id="txt-activateLicenseBtn"></span></button>
        </div>
      </div>

      <p class="hint" id="licenseStatusText"></p>
    </div>
  </section>

  <!-- ==================== PREVIEW / RESULTADO ==================== -->
  <section class="stage" id="stage">

    <div class="scale-compare">
      <h2 id="txt-scaleCompareTitle"></h2>
      <canvas id="scaleCompareCanvas" width="460" height="260"></canvas>
    </div>

    <div class="stage-toolbar" id="stageToolbar" hidden>
      <span id="pageCountText"></span>
      <div class="spacer"></div>
      <button id="printBtn" class="secondary-btn">
        <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><path d="M5 7V2h10v5M5 15h10v4H5v-4Zm-3-.5h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1H2a1 1 0 0 0-1 1v5.5a1 1 0 0 0 1 1Z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
        <span id="txt-printBtn"></span>
      </button>
      <button id="pdfBtn" class="secondary-btn">
        <svg viewBox="0 0 20 20" width="15" height="15" aria-hidden="true"><path d="M10 2v10m0 0 4-4m-4 4L6 8M3 15v2a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="txt-pdfBtn"></span>
      </button>
    </div>

    <div id="pagesContainer" class="pages-container"></div>

  </section>

</main>

<footer class="foot">
  <div class="color-bar" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
  <p id="txt-footer"></p>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="js/i18n.js"></script>
<script src="js/license.js"></script>
<script src="js/app.js"></script>
</body>
</html>
